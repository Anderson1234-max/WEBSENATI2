<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Tu hoja de estilos personalizada -->

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username === 'admin' && password === '123456') {
        window.location.href = 'pagina_destino.html';
      } else {
        alert('Usuario o contraseña incorrectos');
      }
    }
  </script>
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100" style="max-width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)">
    <div class="card shadow p-4" style="width: 100%; max-width: 450px; background-color: white; border-radius: 10px; box-shadow: var(--shadow); padding: 40px;">
      <div class="text-center mb-4">
        <h1><i class="fas fa-graduation-cap"></i> Login</h1>
        <p class="text-muted">Inicie sesión para acceder al sistema</p>
      </div>

      <form method="post" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="username" class="form-label"><i class="fas fa-user"></i> Usuario</label>
          <input type="text" id="username" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"><i class="fas fa-lock"></i> Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Acceso <i class="fas fa-sign-in-alt"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
